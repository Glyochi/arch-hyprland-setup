general {
    lock_cmd = pidof hyprlock || hyprlock --grace 60
# standard session-level lock request. 
# hyprlock is run via lock command to handle the emitted event
    before_sleep_cmd = loginctl lock-session
# Tell display to turn on
    after_sleep_cmd = sh -c 'sleep 1; hyprctl dispatch dpms on'
    ignore_dbus_inhibit = false
}

listener {
    timeout = 600
    on-timeout = systemctl suspend
}
