general {
    immediate_render = true
}

background {
    monitor = DP-1
    path = /home/gly/.config/images/Fireflights.png
    blur_passes = 0
    blur_size = 0
}

background {
    monitor = HDMI-A-1
    path = /home/gly/.config/images/Fireflights.png
    blur_passes = 0
    blur_size = 0
}

background {
    monitor = DP-2
    path = /home/gly/.config/images/FireflightsVert.png
    blur_passes = 0
    blur_size = 0
}

input-field {
    monitor =
    size = 320, 60
    outline_thickness = 2

    outer_color = rgba(0, 0, 0, 0.7)
    inner_color = rgba(20, 20, 20, 0.6)
    font_color = rgb(230, 230, 230)

    placeholder_text = <i>Password...</i>
    check_color = rgb(204, 136, 34)
    fail_color = rgb(204, 34, 34)

    dots_center = true
    fade_on_empty = false

    position = 0, 0 
    halign = center
    valign = center
}

label {
    monitor =
    text = $PAMFAIL
    color = rgb(255, 160, 160)
    font_size = 18
    font_family = Sans

    position = 0, -40
    halign = center
    valign = center
}
